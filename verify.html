        @keyframes shake {
            0%, 100% { transform: translateX(0); }

        /* Modern Liquid Motion Button */

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://ahpvdcdpwtdeoiatjvnq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_HL0ieV-xdZzKkXIcUPK1MQ_4Unh8e_1';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // A real password-reset email link (resetPasswordForEmail's redirectTo) lands here
        // with recovery tokens in the URL that supabase-js auto-detects on page load, firing
        // a PASSWORD_RECOVERY auth event -- no code to type, no sessionStorage dependency
        // (which matters: opening the email on a different device/tab than the one that
        // requested the reset would otherwise strand the user with no pending email on record).
        const isRecoveryLink = window.location.hash.includes('type=recovery')
            || new URLSearchParams(window.location.search).has('code');

        supabaseClient.auth.onAuthStateChange((event) => {
            if (event === 'PASSWORD_RECOVERY') {
                document.querySelector('.header').style.display = 'none';
                document.querySelector('.card').style.display = 'none';
                document.getElementById('new-password-card').style.display = 'block';
            }
        });

        // Retrieve email from sessionStorage (set during signup)
        const pendingEmail = sessionStorage.getItem('pending_verification_email');
        // 'signup' (default) = new account confirmation OTP flow
        const otpFlow = sessionStorage.getItem('otp_flow') || 'signup';
        // A recovery/confirmation link that expired or was already used redirects back here
        // with an error in the hash -- do NOT bounce to signup (that dumped confused users
        // on the wrong page). Show a clear message and let them request a fresh link.
        const hasAuthError = window.location.hash.includes('error')
            || new URLSearchParams(window.location.search).has('error');
        if (hasAuthError) {
            showError('This reset link has expired or was already used. Go back to Login -> "Forgot Password?" for a fresh link, and click it right away.');
        } else if (!pendingEmail && !isRecoveryLink) {
            window.location.href = 'signup.html';
        }
        document.getElementById('user-email').textContent = pendingEmail || '';

        // ─── OTP Input Logic ───
        const inputs = document.querySelectorAll('.otp-input');
        const otpInput = document.getElementById('otp-code');
        otpInput.addEventListener('input', () => {
            otpInput.value = otpInput.value.replace(/\D/g, '').slice(0, 8);
            otpInput.classList.toggle('filled', otpInput.value.length > 0);
            if (otpInput.value.length === 8) verifyOtp();
        });

        function getOtpValue() {
            return otpInput.value;
        }

        // ─── Verify OTP ───
        async function verifyOtp() {
            const token = getOtpValue();
            if (token.length !== 8) {
                showError('Please enter the full 8-digit code.');
                shakeInputs();
                return;
            }

            const btn = document.getElementById('verify-btn');
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            btn.disabled = true;
            btn.textContent = 'Verifying...';

            try {
                const { data, error } = await supabaseClient.auth.verifyOtp({
                    email: pendingEmail,
                    token: token,
                    type: otpFlow === 'login' ? 'recovery' : 'signup'
                });

                if (error) throw error;

                // PostHog: identify the now-verified account + funnel step
                if (window.posthog && data.user) {
                    posthog.identify(data.user.id, { email: pendingEmail });
                    posthog.capture(otpFlow === 'login' ? 'otp_login' : 'email_verified');
                }

                sessionStorage.removeItem('pending_verification_email');
                sessionStorage.removeItem('otp_flow');

                if (otpFlow === 'login') {
                    // Returning user regaining access — let them set a password they'll
                    // actually remember before sending them into the dashboard, rather than
                    // just logging them in on the one-time code with nothing changed.
                    document.getElementById('otp-container').style.display = 'none';
                    btn.style.display = 'none';
                    document.querySelector('.resend-section').style.display = 'none';
                    document.querySelector('.back-link').style.display = 'none';
                    successMsg.style.display = 'none';
                    document.getElementById('new-password-card').style.display = 'block';
                } else {
                    // Success
                    successMsg.textContent = 'Email verified! Setting up your account...';
                    successMsg.style.display = 'block';

                    // Pre-populate profiles table with signup email and names
                    const user = data.user;
                    const fullName = user.user_metadata?.full_name || '';
                    const parts = fullName.split(' ');
                    const firstName = parts[0] || '';
                    const lastName = parts.slice(1).join(' ') || '';

                    // upsert, not update: no trigger creates a profiles row on
                    // auth signup, so at this point the row does NOT exist yet and
                    // an .update() silently matched zero rows -- the name/email
                    // captured here were thrown away and only reappeared at the
                    // very end of onboarding. Creating the row now is also what
                    // lets an interrupted signup be resumed (and emailed) later
                    // instead of vanishing without a trace.
                    await supabaseClient
                        .from('profiles')
                        .upsert({
                            id: user.id,
                            email: pendingEmail,
                            first_name: firstName,
                            last_name: lastName,
                            onboarding_step: 1
                        }, { onConflict: 'id' });

                    setTimeout(() => {
                        window.location.href = 'onboarding.html';
                    }, 1500);
                }

            } catch (err) {
                showError(err.message || 'Invalid code. Please try again.');
                shakeInputs();
                btn.disabled = false;
                btn.textContent = 'Verify & Continue →';
            }
        }

        // ─── Show/hide password (mirrors login.html's toggle) ───
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            icon.innerHTML = isHidden
                ? '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-3.22 4.6M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
                : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle>';
        }

        // ─── Set New Password (forgot-password flow only) ───
        async function setNewPassword() {
            const pwErrorMsg = document.getElementById('pw-error-msg');
            const pwSuccessMsg = document.getElementById('pw-success-msg');
            pwErrorMsg.style.display = 'none';
            pwSuccessMsg.style.display = 'none';

            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword !== newPassword.trim() || confirmPassword !== confirmPassword.trim()) {
                pwErrorMsg.textContent = 'Password cannot start or end with a space. Remove the extra space and try again.';
                pwErrorMsg.style.display = 'block';
                return;
            }

            if (newPassword.length < 8) {
                pwErrorMsg.textContent = 'Password must be at least 8 characters.';
                pwErrorMsg.style.display = 'block';
                return;
            }
            if (newPassword !== confirmPassword) {
                pwErrorMsg.textContent = 'Passwords do not match.';
                pwErrorMsg.style.display = 'block';
                return;
            }

            const btn = document.getElementById('set-password-btn');
            btn.disabled = true;
            btn.textContent = 'Saving...';

            const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

            if (error) {
                pwErrorMsg.textContent = error.message || 'Could not set password. Please try again.';
                pwErrorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Set Password →';
                return;
            }

            pwSuccessMsg.textContent = 'Password set! Redirecting to your dashboard...';
            pwSuccessMsg.style.display = 'block';
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1200);
        }

        function showError(msg) {
            const errorMsg = document.getElementById('error-msg');
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }

        function shakeInputs() {
            inputs.forEach(i => {
                i.classList.add('error-shake');
                setTimeout(() => i.classList.remove('error-shake'), 500);
            });
        }

        // ─── Resend Code ───
        let resendCooldown = 60;
        let resendTimer = null;

        function startResendTimer() {
            const timerText = document.getElementById('timer-text');
            const resendBtn = document.getElementById('resend-btn');
            resendBtn.disabled = true;
            resendCooldown = 60;

            resendTimer = setInterval(() => {
                resendCooldown--;
                timerText.textContent = `Resend available in ${resendCooldown}s`;
                if (resendCooldown <= 0) {
                    clearInterval(resendTimer);
                    timerText.textContent = '';
                    resendBtn.disabled = false;
                }
            }, 1000);
        }

        let _resendInFlight = false;
        async function resendCode() {
            // Guard: never fire two recovery requests in quick succession -- Supabase
            // invalidates the previous token on each new request, so a double-fire makes
            // the first emailed link fail with "One-time token not found" (confirmed via
            // auth logs 2026-08-12: two user_recovery_requested in the same second ->
            // 403 invalid/expired on click -> verify.html bounced the user to signup).
            if (_resendInFlight) return;
            // Cross-page single-send guard (mirrors login.html): block a repeat recovery
            // email within 60s so a second token can't invalidate the first.
            if (otpFlow === 'login') {
                const _rrKey = 'rr_recovery_sent_' + (pendingEmail || '').toLowerCase();
                if (Date.now() - Number(localStorage.getItem(_rrKey) || 0) < 60000) {
                    const sm = document.getElementById('success-msg');
                    sm.textContent = '📧 A reset link was just sent — check your inbox (and spam) and click the newest one.';
                    sm.style.display = 'block';
                    return;
                }
                localStorage.setItem(_rrKey, String(Date.now()));
            }
            _resendInFlight = true;
            const resendBtn = document.getElementById('resend-btn');
            resendBtn.disabled = true;

            try {
                const { error } = otpFlow === 'login'
                    // Reset-password resend MUST carry the SAME redirectTo as login.html's
                    // primary call. Omitting it sent the recovery link to the default Site
                    // URL instead of verify.html, so the recovery token never reached the
                    // set-password form -- the direct cause of the signup.html bounce.
                    ? await supabaseClient.auth.resetPasswordForEmail(pendingEmail, {
                        redirectTo: 'https://myrolerover.com/verify.html',
                      })
                    : await supabaseClient.auth.resend({
                        type: 'signup',
                        email: pendingEmail
                    });

                if (error) throw error;

                const successMsg = document.getElementById('success-msg');
                successMsg.textContent = '📧 New code sent! Check your inbox.';
                successMsg.style.display = 'block';
                setTimeout(() => { successMsg.style.display = 'none'; }, 4000);

                startResendTimer();
            } catch (err) {
                showError(err.message || 'Failed to resend code. Try again later.');
                resendBtn.disabled = false;
            } finally {
                _resendInFlight = false;
            }
        }

        // Start initial timer
        startResendTimer();

        // Auto-focus first input
        inputs[0].focus();
    </script>
</body>
</html>
