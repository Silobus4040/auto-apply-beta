<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Role Rover Document Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --text-heading: #0f172a;
            --text-body: #475569;
            --border: #e2e8f0;
            --primary: #059669;
        }

        [data-theme="dark"] {
            --bg-color: #0b0f17;
            --surface-color: #151c28;
            --text-heading: #f8fafc;
            --text-body: #94a3b8;
            --border: #1e293b;
            --primary: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-color);
            color: var(--text-heading);
        }

        .viewer-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
        }

        .viewer-header {
            height: 62px;
            background: var(--surface-color);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            flex-shrink: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: var(--text-heading);
            font-weight: 900;
        }

        .brand-badge {
            background: #000000;
            color: #ffffff;
            padding: 0.22rem 0.55rem;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .brand-title {
            font-size: 0.95rem;
            font-weight: 800;
        }

        .doc-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-width: 0;
            flex: 1;
            margin: 0 0.75rem;
        }

        .doc-title-text {
            font-size: 0.85rem;
            font-weight: 850;
            color: var(--text-heading);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .doc-subtitle-text {
            font-size: 0.73rem;
            color: var(--text-body);
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            margin-top: 0.1rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 0.4rem 0.9rem;
            font-size: 0.78rem;
            font-weight: 800;
            color: #000000;
            text-decoration: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .back-btn:hover {
            background: #f4f4f5;
            border-color: #000000;
        }

        .viewer-body {
            flex: 1;
            width: 100%;
            height: calc(100vh - 62px);
            position: relative;
            background: #f1f5f9;
        }

        .doc-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #ffffff;
        }

        .loading-state {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--surface-color);
            z-index: 10;
            gap: 0.75rem;
            color: var(--text-body);
            font-size: 0.88rem;
            font-weight: 600;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 640px) {
            .brand-title { display: none; }
            .back-text { display: none; }
            .viewer-header { padding: 0 0.75rem; }
        }
    </style>
</head>
<body>
    <div class="viewer-container">
        <header class="viewer-header">
            <a href="dashboard.html" class="brand-group">
                <span class="brand-badge">ROVER</span>
                <span class="brand-title">Role Rover</span>
            </a>

            <div class="doc-info">
                <div class="doc-title-text" id="doc-title">Loading Document...</div>
                <div class="doc-subtitle-text" id="doc-company"></div>
            </div>

            <a href="dashboard.html" class="back-btn">
                ← <span class="back-text">Back to </span>Applications
            </a>
        </header>

        <main class="viewer-body">
            <div class="loading-state" id="loading-spinner">
                <div class="spinner"></div>
                <div>Opening Document...</div>
            </div>
            <iframe id="doc-iframe" class="doc-iframe" title="Document Preview"></iframe>
        </main>
    </div>

    <script>
        let currentObjectUrl = null;

        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                url: params.get('url'),
                title: params.get('title') || 'Document',
                company: params.get('company') || ''
            };
        }

        async function loadDocument() {
            const { url, title, company } = getQueryParams();
            const titleElem = document.getElementById('doc-title');
            const companyElem = document.getElementById('doc-company');
            const iframe = document.getElementById('doc-iframe');
            const spinner = document.getElementById('loading-spinner');

            if (title) titleElem.innerText = title;
            if (company) companyElem.innerText = company;
            document.title = `${title} - Role Rover`;

            if (!url) {
                spinner.innerHTML = '<div style="color: #ef4444; font-weight: 700;">Document URL not provided.</div>';
                return;
            }

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Fetch failed');
                const blob = await response.blob();
                currentObjectUrl = URL.createObjectURL(blob);
                iframe.src = currentObjectUrl;
            } catch (err) {
                iframe.src = url;
            } finally {
                iframe.onload = () => {
                    spinner.style.display = 'none';
                };
                setTimeout(() => {
                    spinner.style.display = 'none';
                }, 1200);
            }
        }

        window.addEventListener('DOMContentLoaded', loadDocument);
        window.addEventListener('beforeunload', () => {
            if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        });
    </script>
</body>
</html>
