<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Role Rover Document Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-color: #64748b;
            --surface-color: #ffffff;
            --text-heading: #0f172a;
            --text-body: #475569;
            --border: #cbd5e1;
            --primary: #059669;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --text-heading: #f8fafc;
            --text-body: #94a3b8;
            --border: #334155;
            --primary: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-color);
            color: var(--text-heading);
        }

        .viewer-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
        }

        .viewer-header {
            height: 62px;
            background: var(--surface-color);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            flex-shrink: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: var(--text-heading);
            font-weight: 900;
        }

        .brand-badge {
            background: #000000;
            color: #ffffff;
            padding: 0.22rem 0.55rem;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .brand-title {
            font-size: 0.95rem;
            font-weight: 800;
        }

        .doc-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-width: 0;
            flex: 1;
            margin: 0 0.75rem;
        }

        .doc-title-text {
            font-size: 0.85rem;
            font-weight: 850;
            color: var(--text-heading);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .doc-subtitle-text {
            font-size: 0.73rem;
            color: var(--text-body);
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            margin-top: 0.1rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .page-badge {
            font-size: 0.72rem;
            font-weight: 750;
            background: rgba(0,0,0,0.06);
            color: var(--text-body);
            padding: 0.25rem 0.65rem;
            border-radius: 12px;
            white-space: nowrap;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 0.4rem 0.9rem;
            font-size: 0.78rem;
            font-weight: 800;
            color: #000000;
            text-decoration: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .back-btn:hover {
            background: #f4f4f5;
            border-color: #000000;
        }

        .viewer-body {
            flex: 1;
            width: 100%;
            height: calc(100vh - 62px);
            position: relative;
            background: var(--bg-color);
            overflow-y: auto;
            overflow-x: auto;
            padding: 1.25rem 0.75rem 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-overflow-scrolling: touch;
        }

        /* Physical PDF Paper Sheet Styling */
        .paper-page {
            background: #ffffff !important;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.28), 0 2px 6px rgba(0, 0, 0, 0.12) !important;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
            display: block;
        }

        .paper-page canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        .loading-state {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--surface-color);
            z-index: 10;
            gap: 0.75rem;
            color: var(--text-body);
            font-size: 0.88rem;
            font-weight: 600;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 640px) {
            .brand-title { display: none; }
            .back-text { display: none; }
            .viewer-header { padding: 0 0.75rem; }
            .viewer-body { padding: 1rem 0.5rem 2rem; }
        }
    </style>
</head>
<body>
    <div class="viewer-container">
        <header class="viewer-header">
            <a href="dashboard.html" class="brand-group">
                <span class="brand-badge">ROVER</span>
                <span class="brand-title">Role Rover</span>
            </a>

            <div class="doc-info">
                <div class="doc-title-text" id="doc-title">Loading Document...</div>
                <div class="doc-subtitle-text" id="doc-company"></div>
            </div>

            <div class="header-actions">
                <div class="page-badge" id="page-count-badge">PDF</div>
                <a href="dashboard.html" class="back-btn">
                    ← <span class="back-text">Back to </span>Applications
                </a>
            </div>
        </header>

        <main class="viewer-body" id="pdf-paper-container">
            <div class="loading-state" id="loading-spinner">
                <div class="spinner"></div>
                <div>Rendering PDF Paper...</div>
            </div>
        </main>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                url: params.get('url'),
                title: params.get('title') || 'Document',
                company: params.get('company') || ''
            };
        }

        async function renderPDFPaper() {
            const { url, title, company } = getQueryParams();
            const titleElem = document.getElementById('doc-title');
            const companyElem = document.getElementById('doc-company');
            const container = document.getElementById('pdf-paper-container');
            const spinner = document.getElementById('loading-spinner');
            const pageBadge = document.getElementById('page-count-badge');

            if (title) titleElem.innerText = title;
            if (company) companyElem.innerText = company;
            document.title = `${title} - Role Rover`;

            if (!url) {
                spinner.innerHTML = '<div style="color: #ef4444; font-weight: 700;">Document URL not provided.</div>';
                return;
            }

            try {
                const loadingTask = pdfjsLib.getDocument(url);
                const pdf = await loadingTask.promise;
                spinner.style.display = 'none';

                pageBadge.innerText = `1 of ${pdf.numPages}`;

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);

                    // Compute device pixel ratio and responsive scale to fit paper width cleanly
                    const viewportUnscaled = page.getViewport({ scale: 1.0 });
                    const containerWidth = Math.min(window.innerWidth - 24, 820);
                    const scale = containerWidth / viewportUnscaled.width;
                    const viewport = page.getViewport({ scale: scale });

                    const pageWrapper = document.createElement('div');
                    pageWrapper.className = 'paper-page';
                    pageWrapper.style.width = `${viewport.width}px`;
                    pageWrapper.style.height = `${viewport.height}px`;

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');

                    const outputScale = window.devicePixelRatio || 1;
                    canvas.width = Math.floor(viewport.width * outputScale);
                    canvas.height = Math.floor(viewport.height * outputScale);
                    canvas.style.width = `${viewport.width}px`;
                    canvas.style.height = `${viewport.height}px`;

                    const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

                    pageWrapper.appendChild(canvas);
                    container.appendChild(pageWrapper);

                    const renderContext = {
                        canvasContext: context,
                        transform: transform,
                        viewport: viewport
                    };

                    await page.render(renderContext).promise;
                }
            } catch (error) {
                console.error('PDF.js render error:', error);
                spinner.innerHTML = `
                    <div style="color: var(--text-body); text-align: center; padding: 1rem;">
                        <p style="margin-bottom: 0.75rem; font-weight: 700;">Unable to render PDF paper preview directly.</p>
                        <a href="${url}" target="_blank" style="display: inline-block; background: var(--primary); color: #fff; text-decoration: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 800; font-size: 0.85rem;">Open Raw Document Stream</a>
                    </div>
                `;
            }
        }

        window.addEventListener('DOMContentLoaded', renderPDFPaper);
    </script>
</body>
</html>
